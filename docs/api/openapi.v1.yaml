openapi: "3.1.0"
info:
  title: "Lugn paired-device API"
  version: "1.0.0"
  description: "Generated from src/core/device-api.ts by `npm run api:generate`. Do not edit by hand. See docs/IOS-API.md for behaviour."
jsonSchemaDialect: "https://json-schema.org/draft/2020-12/schema"
servers:
  - url: "http://{host}:{port}"
    description: "The Lugn host over Tailscale or the LAN; never the WAN."
    variables:
      host:
        default: "lugn.local"
      port:
        default: "8789"
security:
  - deviceToken: []
paths:
  "/api/v1/me":
    get:
      operationId: "getMe"
      summary: "Describe the authenticated device and the server clock"
      security:
        - deviceToken: []
      x-lugn-scope: "any"
      responses:
        "200":
          description: "This device."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: "Missing, unknown or revoked token."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: "Token lacks the scope, or the request carried a browser Origin header."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiError"
        "421":
          description: "Host header is not allowed."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: "Rate limited; honour Retry-After."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiError"
  "/api/v1/pair":
    post:
      operationId: "pair"
      summary: "Exchange a one-time pairing code for a device token"
      description: "The operator creates the code in the Lugn control panel. The returned token is shown once; Lugn stores only its digest."
      security: []
      requestBody:
        required: true
        x-lugn-max-bytes: 2048
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/PairRequest"
      responses:
        "201":
          description: "Paired."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/PairResponse"
        "400":
          description: "Invalid body."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: "Unknown, used or expired pairing code."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: "Device limit reached."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: "Rate limited; honour Retry-After."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  securitySchemes:
    deviceToken:
      type: "http"
      scheme: "bearer"
      description: "Per-device token from POST /api/v1/pair."
  schemas:
    ApiError:
      type: "object"
      properties:
        error:
          type: "string"
        issues:
          type: "array"
          items:
            type: "object"
            properties:
              path:
                type: "string"
              message:
                type: "string"
            required:
              - "path"
              - "message"
            additionalProperties: false
        retryAfterSeconds:
          type: "integer"
          exclusiveMinimum: 0
          maximum: 9007199254740991
      required:
        - "error"
      additionalProperties: false
    MeResponse:
      type: "object"
      properties:
        apiVersion:
          type: "number"
          const: 1
        device:
          type: "object"
          properties:
            id:
              type: "string"
              pattern: "^dev_[a-z2-7]{16}$"
            name:
              type: "string"
            platform:
              type: "string"
              enum:
                - "ios"
            scopes:
              type: "array"
              items:
                type: "string"
                enum:
                  - "state:read"
                  - "commands:write"
                  - "phone:ingest"
          required:
            - "id"
            - "name"
            - "platform"
            - "scopes"
          additionalProperties: false
        serverTime:
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
      required:
        - "apiVersion"
        - "device"
        - "serverTime"
      additionalProperties: false
    PairRequest:
      type: "object"
      properties:
        code:
          type: "string"
          pattern: "^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{4}-?[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{4}$"
        name:
          type: "string"
          minLength: 1
          maxLength: 64
          pattern: "^[^\\p{Cc}\\p{Cf}]+$"
        platform:
          type: "string"
          enum:
            - "ios"
        appVersion:
          type: "string"
          pattern: "^[0-9A-Za-z.+-]{1,32}$"
      required:
        - "code"
        - "name"
        - "platform"
      additionalProperties: false
    PairResponse:
      type: "object"
      properties:
        apiVersion:
          type: "number"
          const: 1
        deviceId:
          type: "string"
          pattern: "^dev_[a-z2-7]{16}$"
        token:
          type: "string"
          minLength: 1
        tokenType:
          type: "string"
          const: "Bearer"
        scopes:
          type: "array"
          items:
            type: "string"
            enum:
              - "state:read"
              - "commands:write"
              - "phone:ingest"
        issuedAt:
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
      required:
        - "apiVersion"
        - "deviceId"
        - "token"
        - "tokenType"
        - "scopes"
        - "issuedAt"
      additionalProperties: false
