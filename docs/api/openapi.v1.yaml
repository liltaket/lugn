openapi: "3.1.0"
info:
  title: "Lugn paired-device API"
  version: "1.0.0"
  description: "Generated from src/core/device-api.ts by `npm run api:generate`. Do not edit by hand. See docs/IOS-API.md for behaviour."
jsonSchemaDialect: "https://json-schema.org/draft/2020-12/schema"
servers:
  - url: "http://{host}:{port}"
    description: "The Lugn host over Tailscale or the LAN; never the WAN."
    variables:
      host:
        default: "lugn.local"
      port:
        default: "8789"
security:
  - deviceToken: []
paths:
  "/api/v1/commands":
    post:
      operationId: "postCommand"
      summary: "Run one typed command through the capability registry"
      description: "Idempotent by requestId per device. `input` follows the CommandInput.<command> schema named by `x-lugn-command-inputs`. `accepted` means Lugn took the intent; device feedback arrives in state."
      security:
        - deviceToken: []
      x-lugn-scope: "commands:write"
      x-lugn-command-inputs:
        "lighting.activateScene": "#/components/schemas/CommandInput.lighting.activateScene"
        "lighting.reapplyScene": "#/components/schemas/CommandInput.lighting.reapplyScene"
        "lighting.set": "#/components/schemas/CommandInput.lighting.set"
        "lighting.adjust": "#/components/schemas/CommandInput.lighting.adjust"
        "music.play": "#/components/schemas/CommandInput.music.play"
        "music.pause": "#/components/schemas/CommandInput.music.pause"
        "music.setVolume": "#/components/schemas/CommandInput.music.setVolume"
        "music.fadeVolume": "#/components/schemas/CommandInput.music.fadeVolume"
        "music.cancelFade": "#/components/schemas/CommandInput.music.cancelFade"
        "music.selectSource": "#/components/schemas/CommandInput.music.selectSource"
        "music.playPreset": "#/components/schemas/CommandInput.music.playPreset"
        "music.setVolumeAuthority": "#/components/schemas/CommandInput.music.setVolumeAuthority"
        "switch.set": "#/components/schemas/CommandInput.switch.set"
        "presence.setCountOne": "#/components/schemas/CommandInput.presence.setCountOne"
        "routines.bedtime": "#/components/schemas/CommandInput.routines.bedtime"
        "routines.action": "#/components/schemas/CommandInput.routines.action"
        "suggestions.respond": "#/components/schemas/CommandInput.suggestions.respond"
      requestBody:
        required: true
        x-lugn-max-bytes: 16384
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/CommandRequest"
      responses:
        "200":
          description: "Accepted or confirmed."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/CommandResponse"
        "400":
          description: "Invalid request or input."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: "Missing, unknown or revoked token."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: "Token lacks the scope, or the request carried a browser Origin header."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: "Unknown target or scene."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: "Request id reused with another body, or the command was refused by policy."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiError"
        "421":
          description: "Host header is not allowed."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: "Rate limited; honour Retry-After."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: "The command failed downstream."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiError"
  "/api/v1/events":
    get:
      operationId: "streamEvents"
      summary: "Server-sent state snapshots and section patches"
      description: "Events: `snapshot` (StateView), `patch` (StatePatch, replace listed sections), `heartbeat` (HeartbeatEvent, no id). Event ids are `<instanceId>-<revision>`; reconnect with Last-Event-ID."
      security:
        - deviceToken: []
      x-lugn-scope: "state:read"
      parameters:
        - name: "Last-Event-ID"
          in: "header"
          required: false
          schema:
            type: "string"
            pattern: "^[A-Za-z0-9]+-[0-9]+$"
        - name: "lastEventId"
          in: "query"
          required: false
          description: "Fallback for clients that cannot set the header."
          schema:
            type: "string"
            pattern: "^[A-Za-z0-9]+-[0-9]+$"
      x-lugn-sse-events:
        snapshot: "#/components/schemas/StateView"
        patch: "#/components/schemas/StatePatch"
        heartbeat: "#/components/schemas/HeartbeatEvent"
      responses:
        "200":
          description: "An event stream."
          content:
            "text/event-stream":
              schema:
                type: "string"
        "401":
          description: "Missing, unknown or revoked token."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: "Token lacks the scope, or the request carried a browser Origin header."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiError"
        "421":
          description: "Host header is not allowed."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: "Rate limited; honour Retry-After."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: "Too many streams."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiError"
  "/api/v1/me":
    get:
      operationId: "getMe"
      summary: "Describe the authenticated device and the server clock"
      security:
        - deviceToken: []
      x-lugn-scope: "any"
      responses:
        "200":
          description: "This device."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: "Missing, unknown or revoked token."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: "Token lacks the scope, or the request carried a browser Origin header."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiError"
        "421":
          description: "Host header is not allowed."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: "Rate limited; honour Retry-After."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiError"
  "/api/v1/pair":
    post:
      operationId: "pair"
      summary: "Exchange a one-time pairing code for a device token"
      description: "The operator creates the code in the Lugn control panel. The returned token is shown once; Lugn stores only its digest."
      security: []
      requestBody:
        required: true
        x-lugn-max-bytes: 2048
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/PairRequest"
      responses:
        "201":
          description: "Paired."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/PairResponse"
        "400":
          description: "Invalid body."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: "Unknown, used or expired pairing code."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: "Device limit reached."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: "Rate limited; honour Retry-After."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiError"
  "/api/v1/phone/config":
    get:
      operationId: "getPhoneConfig"
      summary: "Which phone signals Lugn accepts, with age limits"
      security:
        - deviceToken: []
      x-lugn-scope: "phone:ingest"
      responses:
        "200":
          description: "Signal settings."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/PhoneConfigResponse"
        "401":
          description: "Missing, unknown or revoked token."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: "Token lacks the scope, or the request carried a browser Origin header."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiError"
        "421":
          description: "Host header is not allowed."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: "Rate limited; honour Retry-After."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiError"
  "/api/v1/phone/observations":
    post:
      operationId: "postPhoneObservations"
      summary: "Submit batched, idempotent phone observations (hints only)"
      description: "Each observation has a UUID eventId, a per-session sequence and the device timestamp. Results report applied, duplicate, superseded, rejected or ignored per event. Observations never set room presence."
      security:
        - deviceToken: []
      x-lugn-scope: "phone:ingest"
      requestBody:
        required: true
        x-lugn-max-bytes: 65536
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/PhoneObservationBatch"
      responses:
        "200":
          description: "Per-event results."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/PhoneObservationResponse"
        "400":
          description: "Invalid batch."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: "Missing, unknown or revoked token."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: "Token lacks the scope, or the request carried a browser Origin header."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiError"
        "421":
          description: "Host header is not allowed."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: "Rate limited; honour Retry-After."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiError"
  "/api/v1/state":
    get:
      operationId: "getState"
      summary: "Read the compact room state view"
      security:
        - deviceToken: []
      x-lugn-scope: "state:read"
      responses:
        "200":
          description: "Current view."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/StateView"
        "401":
          description: "Missing, unknown or revoked token."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: "Token lacks the scope, or the request carried a browser Origin header."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiError"
        "421":
          description: "Host header is not allowed."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: "Rate limited; honour Retry-After."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  securitySchemes:
    deviceToken:
      type: "http"
      scheme: "bearer"
      description: "Per-device token from POST /api/v1/pair."
  schemas:
    ApiError:
      type: "object"
      properties:
        error:
          type: "string"
        issues:
          type: "array"
          items:
            type: "object"
            properties:
              path:
                type: "string"
              message:
                type: "string"
            required:
              - "path"
              - "message"
            additionalProperties: false
        retryAfterSeconds:
          type: "integer"
          exclusiveMinimum: 0
          maximum: 9007199254740991
      required:
        - "error"
      additionalProperties: false
    "CommandInput.lighting.activateScene":
      type: "object"
      properties:
        sceneId:
          type: "string"
      required:
        - "sceneId"
    "CommandInput.lighting.adjust":
      type: "object"
      properties:
        target:
          type: "string"
        brightnessDelta:
          type: "integer"
          minimum: -9007199254740991
          maximum: 9007199254740991
      required:
        - "target"
        - "brightnessDelta"
    "CommandInput.lighting.reapplyScene":
      type: "object"
      properties: {}
    "CommandInput.lighting.set":
      type: "object"
      properties:
        target:
          type: "string"
        values:
          type: "object"
          properties:
            power:
              type: "boolean"
            brightness:
              type: "integer"
              minimum: 0
              maximum: 100
            colorTemperature:
              type: "integer"
              minimum: 1000
              maximum: 10000
            rgb:
              type: "array"
              prefixItems:
                - type: "integer"
                  minimum: 0
                  maximum: 255
                - type: "integer"
                  minimum: 0
                  maximum: 255
                - type: "integer"
                  minimum: 0
                  maximum: 255
              items: false
              minItems: 3
              maxItems: 3
        temperatureScope:
          type: "string"
          enum:
            - "target"
            - "scene"
      required:
        - "target"
        - "values"
    "CommandInput.music.cancelFade":
      type: "object"
      properties:
        target:
          type: "string"
          pattern: "^music\\.[a-z0-9][a-z0-9._-]*$"
      required:
        - "target"
      additionalProperties: false
    "CommandInput.music.fadeVolume":
      type: "object"
      properties:
        target:
          type: "string"
          pattern: "^music\\.[a-z0-9][a-z0-9._-]*$"
        volume:
          type: "number"
          minimum: 0
          maximum: 1
        durationMs:
          type: "integer"
          minimum: 1000
          maximum: 120000
      required:
        - "target"
        - "volume"
        - "durationMs"
      additionalProperties: false
    "CommandInput.music.pause":
      type: "object"
      properties:
        target:
          type: "string"
          pattern: "^music\\.[a-z0-9][a-z0-9._-]*$"
      required:
        - "target"
      additionalProperties: false
    "CommandInput.music.play":
      type: "object"
      properties:
        target:
          type: "string"
          pattern: "^music\\.[a-z0-9][a-z0-9._-]*$"
      required:
        - "target"
      additionalProperties: false
    "CommandInput.music.playPreset":
      type: "object"
      properties:
        target:
          type: "string"
          pattern: "^music\\.[a-z0-9][a-z0-9._-]*$"
        preset:
          type: "string"
          enum:
            - "spotify_dj"
            - "optical"
      required:
        - "target"
        - "preset"
      additionalProperties: false
    "CommandInput.music.selectSource":
      type: "object"
      properties:
        target:
          type: "string"
          pattern: "^music\\.[a-z0-9][a-z0-9._-]*$"
        source:
          type: "string"
          minLength: 1
      required:
        - "target"
        - "source"
      additionalProperties: false
    "CommandInput.music.setVolume":
      type: "object"
      properties:
        target:
          type: "string"
          pattern: "^music\\.[a-z0-9][a-z0-9._-]*$"
        volume:
          type: "number"
          minimum: 0
          maximum: 1
      required:
        - "target"
        - "volume"
      additionalProperties: false
    "CommandInput.music.setVolumeAuthority":
      type: "object"
      properties:
        target:
          type: "string"
          pattern: "^music\\.[a-z0-9][a-z0-9._-]*$"
        mode:
          type: "string"
          enum:
            - "auto"
            - "manual"
      required:
        - "target"
        - "mode"
      additionalProperties: false
    "CommandInput.presence.setCountOne":
      type: "object"
      properties: {}
      additionalProperties: false
    "CommandInput.routines.action":
      type: "object"
      properties:
        id:
          type: "string"
          pattern: "^[a-zA-Z0-9][a-zA-Z0-9._-]{0,79}$"
        action:
          type: "string"
          enum:
            - "start"
            - "cancel"
            - "snooze"
            - "skip"
        requestId:
          type: "string"
          minLength: 1
          maxLength: 128
        minutes:
          type: "integer"
          minimum: 1
          maximum: 120
      required:
        - "id"
        - "action"
      additionalProperties: false
    "CommandInput.routines.bedtime":
      oneOf:
        - type: "object"
          properties:
            action:
              type: "string"
              const: "start"
            expectedGeneration:
              type: "string"
              format: "uuid"
              pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
            requestId:
              type: "string"
              minLength: 1
              maxLength: 128
            wakeTime:
              type: "string"
              pattern: "^(?:[01]\\d|2[0-3]):[0-5]\\d$"
            mode:
              type: "string"
              enum:
                - "auto"
                - "button"
                - "none"
            music:
              default: false
              type: "boolean"
          required:
            - "action"
            - "expectedGeneration"
            - "requestId"
            - "wakeTime"
            - "mode"
          additionalProperties: false
        - type: "object"
          properties:
            action:
              type: "string"
              const: "plan"
            expectedGeneration:
              type: "string"
              format: "uuid"
              pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
            requestId:
              type: "string"
              minLength: 1
              maxLength: 128
            wakeTime:
              type: "string"
              pattern: "^(?:[01]\\d|2[0-3]):[0-5]\\d$"
            mode:
              type: "string"
              enum:
                - "auto"
                - "button"
                - "none"
            music:
              default: false
              type: "boolean"
          required:
            - "action"
            - "expectedGeneration"
            - "requestId"
            - "wakeTime"
            - "mode"
          additionalProperties: false
        - type: "object"
          properties:
            action:
              type: "string"
              const: "clear"
            expectedGeneration:
              type: "string"
              format: "uuid"
              pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
            requestId:
              type: "string"
              minLength: 1
              maxLength: 128
          required:
            - "action"
            - "expectedGeneration"
            - "requestId"
          additionalProperties: false
        - type: "object"
          properties:
            action:
              type: "string"
              const: "morning"
            expectedGeneration:
              type: "string"
              format: "uuid"
              pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
            requestId:
              type: "string"
              minLength: 1
              maxLength: 128
            music:
              default: false
              type: "boolean"
          required:
            - "action"
            - "expectedGeneration"
            - "requestId"
          additionalProperties: false
    "CommandInput.suggestions.respond":
      type: "object"
      properties:
        id:
          type: "string"
          minLength: 1
          maxLength: 512
        action:
          type: "string"
          enum:
            - "accept"
            - "reject"
            - "dismiss"
      required:
        - "id"
        - "action"
      additionalProperties: false
    "CommandInput.switch.set":
      type: "object"
      properties:
        target:
          type: "string"
          pattern: "^switch\\.[a-z0-9][a-z0-9._-]*$"
        state:
          type: "boolean"
      required:
        - "target"
        - "state"
      additionalProperties: false
    CommandRequest:
      type: "object"
      properties:
        requestId:
          type: "string"
          format: "uuid"
          pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
        command:
          type: "string"
          enum:
            - "lighting.activateScene"
            - "lighting.reapplyScene"
            - "lighting.set"
            - "lighting.adjust"
            - "music.play"
            - "music.pause"
            - "music.setVolume"
            - "music.fadeVolume"
            - "music.cancelFade"
            - "music.selectSource"
            - "music.playPreset"
            - "music.setVolumeAuthority"
            - "switch.set"
            - "presence.setCountOne"
            - "routines.bedtime"
            - "routines.action"
            - "suggestions.respond"
        input:
          default: {}
          type: "object"
          propertyNames:
            type: "string"
          additionalProperties: {}
        reason:
          type: "string"
          minLength: 1
          maxLength: 200
      required:
        - "requestId"
        - "command"
      additionalProperties: false
    CommandResponse:
      type: "object"
      properties:
        requestId:
          type: "string"
          format: "uuid"
          pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
        command:
          type: "string"
          enum:
            - "lighting.activateScene"
            - "lighting.reapplyScene"
            - "lighting.set"
            - "lighting.adjust"
            - "music.play"
            - "music.pause"
            - "music.setVolume"
            - "music.fadeVolume"
            - "music.cancelFade"
            - "music.selectSource"
            - "music.playPreset"
            - "music.setVolumeAuthority"
            - "switch.set"
            - "presence.setCountOne"
            - "routines.bedtime"
            - "routines.action"
            - "suggestions.respond"
        status:
          type: "string"
          enum:
            - "accepted"
            - "confirmed"
        replayed:
          type: "boolean"
        result: {}
        revision:
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
      required:
        - "requestId"
        - "command"
        - "status"
        - "replayed"
        - "result"
        - "revision"
      additionalProperties: false
    HeartbeatEvent:
      type: "object"
      properties:
        instanceId:
          type: "string"
        revision:
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
        serverTime:
          type: "number"
          minimum: 0
      required:
        - "instanceId"
        - "revision"
        - "serverTime"
      additionalProperties: false
    MeResponse:
      type: "object"
      properties:
        apiVersion:
          type: "number"
          const: 1
        device:
          type: "object"
          properties:
            id:
              type: "string"
              pattern: "^dev_[a-z2-7]{16}$"
            name:
