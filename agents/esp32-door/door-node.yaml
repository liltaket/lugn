# Production image: base + audio + voice. The camera is in
# door-node-camera.yaml until the camera module answers on SCCB: with no
# camera, camera probing has blocked the main loop past the 5 s task
# watchdog, and the node fell into safe mode after five such boots.
substitutions:
  name: lugn-door
  friendly_name: Lugn dörrnod
packages:
  base: !include packages/base.yaml
  audio: !include packages/audio.yaml
  voice: !include packages/voice.yaml
