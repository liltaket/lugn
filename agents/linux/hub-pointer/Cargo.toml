[package]
name = "lugn-hub-pointer"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
license-file = "../../../LICENSE"
description = "Lets the desktop pointer slide into a Nest Hub dashboard page (InputCapture portal + libei)"

[[bin]]
name = "lugn-hub-pointer"
path = "src/main.rs"

[dependencies]
anyhow = "1"
ashpd = { version = "0.14.1", default-features = false, features = ["tokio", "input_capture"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
reis = { version = "0.7.1", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "time", "signal", "sync"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
toml = "0.9"
# Same version ashpd already uses, so no new crates: KWin script and effects calls.
zbus = { version = "6.4", default-features = false, features = ["tokio", "proxy", "service"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

# Standalone package: not a member of the lugn-linux-agent build.
[workspace]
