# Copy to ~/.config/lugn-linux-agent/config.toml and chmod 600.
# Unique per computer. Letters/digits first, then letters/digits/_/-; max 64.
device_id = "desktop"
mqtt_host = "127.0.0.1"
mqtt_port = 1883
mqtt_tls = false
# For TLS normally set mqtt_port = 8883 and mqtt_tls = true.
# mqtt_ca_file = "/home/your-user/.config/lugn-linux-agent/broker-ca.pem"
# mqtt_username = "desktop-agent"
# Prefer LUGN_MQTT_PASSWORD in the optional systemd environment file.
# mqtt_password = "replace-in-your-private-config-only"
topic_prefix = "lugn/computers"
heartbeat_secs = 30
idle_secs = 300
# Exact KWin desktopFileName IDs, case sensitive; Steam app resource classes
# steam_app_* are recognized independently. Leave empty until verified locally.
gaming_app_ids = []
video_app_ids = []
music_app_ids = []

# Optional targeted media Pause/owned Resume over authenticated MQTT.
# See protocol/CONTROL.md before enabling.
control_enabled = false

# Opt-in MPRIS artwork: publishes Spotify image IDs or small Firefox thumbnails.
# No network fetches; only Firefox's fixed, user-owned MPRIS PNG caches are read.
# Thumbnails/media metadata may be private. Use a trusted broker.
collect_artwork = false

# Optional display sleep/wake requests over authenticated MQTT (DISPLAY v1, see
# protocol/DISPLAY.md). Lugn decides when; the agent only runs a fixed command:
# "kscreen-doctor --dpms off|on" (Plasma Wayland) or "xset dpms force off|on" (X11).
# display_backend: "auto" (default, WAYLAND_DISPLAY -> kscreen, DISPLAY -> xset),
# "kscreen" or "xset". Requires MQTT username/password and broker ACLs.
display_control_enabled = false
display_backend = "auto"
# Idle time (seconds, 10-3600) after which `input_idle` becomes true. It follows
# keyboard/pointer input only and ignores idle inhibitors such as video players.
display_input_idle_secs = 120

# Optional fast WiiM Optical switching (see README). The agent talks to the WiiM
# directly: when the computer plays sustained, audible sound and the WiiM is paused
# or idle, it switches the WiiM to Optical. Needs pw-record from pipewire-bin.
optical_switch_enabled = false
# wiim_host = "192.168.1.50"
# Exact PipeWire sink node name wired to the WiiM (pactl list short sinks).
# Leave unset to follow the default sink.
# optical_audio_sink = "alsa_output.pci-0000_00_1f.3.iec958-stereo"
# Sustained sound needed before switching, in milliseconds (200-5000).
optical_min_audible_ms = 400
