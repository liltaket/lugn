[package]
name = "lugn-linux-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license-file = "../../LICENSE"

[dependencies]
anyhow = "1"
futures-util = "0.3"
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "signal", "process", "io-util", "net"] }
toml = "0.9"
uuid = { version = "1", features = ["v4"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
